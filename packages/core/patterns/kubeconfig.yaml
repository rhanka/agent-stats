# Default kubeconfig secret patterns for `agent-stats clean`.
#
# These regexes are applied ON TOP of secretlint's preset-recommend rules, on
# every scan, without needing `--secret-patterns`. They catch kubeconfig
# material that the generic rules don't know about:
#
# - `kubeconfig-blob`: a whole kubeconfig file base64-encoded (e.g. pasted
#   `cat ~/.kube/config | base64` output). Anchored on the base64 of the
#   canonical header `apiVersion: v1` + `kind: Config`
#   (`YXBpVmVyc2lvbjogdjEKa2luZDogQ29uZmln`), then a long base64 run
#   (newlines allowed for `base64`-wrapped output, spaces not).
# - `kubeconfig-client-key-data`, `kubeconfig-client-certificate-data`,
#   `kubeconfig-certificate-authority-data`: the base64 PEM values of those
#   YAML keys (only the value is redacted, the key name is kept).
# - `kubeconfig-token`: the value of a YAML `token:` key (JWT or opaque).
# - `kubeconfig-pem-material`: bare `LS0t…` base64 (a PEM header `-----`
#   encoded) appearing without its YAML key — e.g. a JSON-split value.
#
# Each match is redacted to `<<SECRET:<rule>:<hash>>>` (the raw value is never
# written). The `g` flag is always enforced.
#
# This file is the human-readable source of truth. The same patterns are
# built into the scanner (`packages/core/src/kubeconfig-patterns.ts`);
# `kubeconfig-patterns.test.ts` fails if the two drift apart. Pass this file
# explicitly with `agent-stats clean --secret-patterns` only to pin the set.

patterns:
  - id: kubeconfig-blob
    pattern: 'YXBpVmVyc2lvbjogdjEKa2luZDogQ29uZmln[A-Za-z0-9+/=\r\n]{200,}'

  - id: kubeconfig-client-key-data
    pattern: '(?<=client-key-data:\s*["'']?)[A-Za-z0-9+/=_-]{40,}={0,2}'

  - id: kubeconfig-client-certificate-data
    pattern: '(?<=client-certificate-data:\s*["'']?)[A-Za-z0-9+/=_-]{40,}={0,2}'

  - id: kubeconfig-certificate-authority-data
    pattern: '(?<=certificate-authority-data:\s*["'']?)[A-Za-z0-9+/=_-]{40,}={0,2}'

  - id: kubeconfig-token
    pattern: '(?<=token:\s*["'']?)[A-Za-z0-9._\-+/=]{20,}'

  - id: kubeconfig-pem-material
    pattern: 'LS0t[A-Za-z0-9+/=]{40,}'
